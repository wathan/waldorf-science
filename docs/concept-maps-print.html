    padding: 1.4mm 1mm; font-size: 7.4pt; color: var(--soft);

  .legend .tag { font-weight: 700; color: var(--ink); border: 0.8px solid var(--ink); border-radius: 2px; padding: 0 1mm; font-size: 7pt; }
  .legend svg { vertical-align: middle; }

/* ============================== ENGINE ============================== */
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}, parent=null, text=null){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text!=null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function wrap(text, max){
  const words = text.split(" "); const lines=[]; let cur="";
  for (const w of words){
    if ((cur+" "+w).trim().length > max && cur){ lines.push(cur); cur=w; }
    else cur = (cur+" "+w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

const NODE_W = 188, LINE_H = 13, SLOTW = 200, TIER_H = 104;
const GUTTER = 58, HULL_PAD = 26, HULL_TOP = 38;

function buildPage(cfg){
  const nodeById = Object.fromEntries(cfg.nodes.map(n=>[n.id,n]));
  const childrenOf = {};
  for (const id in cfg.parents){ (childrenOf[cfg.parents[id]] ||= []).push(id); }

  // box geometry
  cfg.nodes.forEach(n=>{
    n._lines = wrap(n.label, 24);
    n._w = NODE_W;
    n._h = 11 + n._lines.length*LINE_H + 14;
  });

  // local tidy-tree layout per cluster, then measure each cluster's footprint
  const info = {};
  for (const key in cfg.clusters){
    const mem = cfg.nodes.filter(n=>n.c===key);
    const roots = mem.filter(n=>!cfg.parents[n.id]).map(n=>n.id);
    let leaf = 0;
    const place = (id, depth)=>{
      const n = nodeById[id]; n._depth = depth;
      const kids = childrenOf[id] || [];
      if (!kids.length){ n._tx = leaf++; }
      else { kids.forEach(k=>place(k, depth+1)); n._tx = (nodeById[kids[0]]._tx + nodeById[kids[kids.length-1]]._tx)/2; }
    };
    roots.forEach(r=>place(r,0));
    const minTx = Math.min(...mem.map(n=>n._tx)), maxTx = Math.max(...mem.map(n=>n._tx));
    const maxDepth = Math.max(...mem.map(n=>n._depth));
    const maxH = Math.max(...mem.map(n=>n._h));
    info[key] = {
      mem, minTx, maxDepth, maxH,
      w: (maxTx-minTx)*SLOTW + NODE_W + 2*HULL_PAD,
      h: HULL_TOP + maxDepth*TIER_H + maxH + 2*HULL_PAD,
    };
  }

  // pack the grid: each column as wide as its widest cluster, each row as tall as its tallest
  let maxCol=0, maxRow=0;
  for (const key in cfg.clusters){ const [c,r]=cfg.grid[key]; maxCol=Math.max(maxCol,c); maxRow=Math.max(maxRow,r); }
  const colW = Array(maxCol+1).fill(0), rowH = Array(maxRow+1).fill(0);
  for (const key in cfg.clusters){ const [c,r]=cfg.grid[key]; colW[c]=Math.max(colW[c], info[key].w); rowH[r]=Math.max(rowH[r], info[key].h); }
  const colX=[], rowY=[];
  for (let c=0,acc=0;c<=maxCol;c++){ colX[c]=acc; acc+=colW[c]+GUTTER; }
  for (let r=0,acc=0;r<=maxRow;r++){ rowY[r]=acc; acc+=rowH[r]+GUTTER; }

  // place nodes inside their packed cell
  for (const key in cfg.clusters){
    const [c,r]=cfg.grid[key]; const ci=info[key];
    const ox = colX[c] + HULL_PAD + NODE_W/2 - ci.minTx*SLOTW;
    const oyTop = rowY[r] + HULL_TOP + HULL_PAD + ci.maxH/2;
    ci.mem.forEach(n=>{ n.x = ox + n._tx*SLOTW; n.y = oyTop + n._depth*TIER_H; });
  }

  // edges (combine within-theme + bridges + hinges)
  const edges = [];
  for (const child in cfg.parents) edges.push([cfg.parents[child], child, "dep", null]);
  for (const [a,b] of cfg.bridges) edges.push([a,b,"bridge", null]);
  for (const [a,b,lbl] of (cfg.hinges||[])) edges.push([a,b,"hinge", lbl]);

  // box-edge trim for arrowheads
  function boxEdge(from, to, gap=4){
    const ux=from.x-to.x, uy=from.y-to.y;
    const hw=to._w/2+gap, hh=to._h/2+gap;
    const t=Math.min(hw/Math.max(Math.abs(ux),1e-6), hh/Math.max(Math.abs(uy),1e-6));
    return { x: to.x+ux*t, y: to.y+uy*t };
  }

  // ---------- build SVG ----------
  const svg = el("svg", { class:"map", xmlns:SVGNS });
  el("defs", {}, svg).innerHTML =
    '<marker id="ar-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>'+
    '<marker id="ar-bridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>'+
    '<marker id="ar-hinge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>';

  const gHull = el("g", {}, svg);
  const gEdge = el("g", {}, svg);
  const gNode = el("g", {}, svg);

  // hulls
  for (const key in cfg.clusters){
    const mem = cfg.nodes.filter(n=>n.c===key);
    if (!mem.length) continue;
    const xs=[], ys=[];
    mem.forEach(n=>{ xs.push(n.x-n._w/2, n.x+n._w/2); ys.push(n.y-n._h/2, n.y+n._h/2); });
    const minX=Math.min(...xs)-HULL_PAD, maxX=Math.max(...xs)+HULL_PAD;
    const minY=Math.min(...ys)-HULL_PAD-HULL_TOP, maxY=Math.max(...ys)+HULL_PAD;
    el("rect", { x:minX, y:minY, width:maxX-minX, height:maxY-minY, rx:10, class:"hull" }, gHull);
    el("text", { x:minX+12, y:minY+18, class:"hull-title" }, gHull, cfg.clusters[key].title);
    el("text", { x:minX+12, y:minY+31, class:"hull-anchor" }, gHull, "“"+cfg.clusters[key].anchor+"”");
    el("text", { x:minX+12, y:minY+42, class:"hull-lean" }, gHull, LEANTXT[cfg.clusters[key].lean]);
  }

  // edges
  for (const [a,b,type,lbl] of edges){
    const na=nodeById[a], nb=nodeById[b];
    if (!na||!nb) continue;
    const p1=boxEdge(nb,na), p2=boxEdge(na,nb);
    el("line", { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, class:"edge "+type,
      "marker-end":`url(#ar-${type})` }, gEdge);
  }

  // nodes
  for (const n of cfg.nodes){
    const g = el("g", { transform:`translate(${n.x},${n.y})` }, gNode);
    el("rect", { class:"box", x:-n._w/2, y:-n._h/2, width:n._w, height:n._h, rx:5 }, g);
    const startY = -n._h/2 + 11 + 3;
    n._lines.forEach((ln,i)=> el("text", { class:"lbl", x:0, y:startY+i*LINE_H, "text-anchor":"middle" }, g, ln));
    el("text", { class:"comps", x:0, y:startY + n._lines.length*LINE_H + 2, "text-anchor":"middle" }, g, n.comps.join("  ·  "));
    el("text", { class:"tag", x:n._w/2-9, y:-n._h/2+11, "text-anchor":"middle" }, g, AFFTAG[n.aff]);
  }

  // viewBox to fit all content
  const allX=[], allY=[];
  cfg.nodes.forEach(n=>{ allX.push(n.x-n._w/2, n.x+n._w/2); allY.push(n.y-n._h/2, n.y+n._h/2); });
  const m=46;
  const minX=Math.min(...allX)-m, minY=Math.min(...allY)-m-HULL_TOP;
  const maxX=Math.max(...allX)+m, maxY=Math.max(...allY)+m;
  svg.setAttribute("viewBox", `${minX} ${minY} ${maxX-minX} ${maxY-minY}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  return svg;
}

PAGES.forEach((cfg, i)=>{
  const page = document.createElement("div"); page.className="page";

  const head = document.createElement("header"); head.className="h";
  head.innerHTML =

    `<h1>${cfg.title}</h1><span class="sub">${cfg.sub}</span>`;

  const leg = document.createElement("div"); leg.className="legend";
  leg.innerHTML =
    '<span class="k"><span class="tag">1</span> Cand. 1 — epistemological</span>'+

    '<span class="k"><span class="tag">◆</span> shared / synthesis</span>'+
    '<span class="k"><svg width="30" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#555" stroke-width="1.4"/><path d="M22,1 L29,4 L22,7 z" fill="#555"/></svg> builds toward</span>'+
    '<span class="k"><svg width="30" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M22,1 L29,4 L22,7 z" fill="#999"/></svg> bridge (cross-theme)</span>'+
    (cfg.hinges && cfg.hinges.length
      ? '<span class="k"><svg width="30" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/><path d="M22,1 L29,4 L22,7 z" fill="#000"/></svg> <b>hinge (Optics↔Cosmology)</b></span>'
      : '');
  page.appendChild(leg);

  const stage = document.createElement("div"); stage.className="stage";
  stage.appendChild(buildPage(cfg));
  page.appendChild(stage);

  const foot = document.createElement("footer"); foot.className="f";
  foot.innerHTML = cfg.foot;
  page.appendChild(foot);

  root.appendChild(page);
});
